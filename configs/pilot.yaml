# Adopted 16 October. The four-clip training config is a diagnostic, not a final run.
status: pixel_pilot_adopted
data:
  resolution: 64
  total_frames: 32
  future_frames: 31
  video_fps: 8
  initial_objects: 2
  max_objects: 4
