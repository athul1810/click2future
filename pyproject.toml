[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "click2future"
version = "0.0.1"
description = "Development scaffold for action-conditioned tabletop video generation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "pillow>=11,<13",
    "pyyaml>=6,<7",
    "pymunk==7.3.1",
]

[project.optional-dependencies]
cpu = ["torch==2.11.0", "torchvision==0.26.0"]
cu128 = [
    "torch==2.11.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "torchvision==0.26.0; sys_platform == 'win32' or sys_platform == 'linux'",
]
image-metrics = ["scikit-image==0.26.0", "lpips==0.1.4", "torchvision==0.26.0"]

[project.scripts]
click2future-check = "click2future.env_check:main"

[dependency-groups]
dev = [
    "ipykernel>=6,<8",
    "pip>=25,<27",
    "pytest>=8,<10",
    "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/click2future"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/click2future/**/*.py",
    "/tests/test_*.py",
    "/configs/**/*.yaml",
    "/configs/**/*.toml",
    "/configs/**/*.json",
    "/tests/fixtures/*.json",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
    "/submission/*.md",
    "/submission/*.py",
    "/submission/*.json",
]

[tool.uv]
required-version = "==0.13.0"
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
