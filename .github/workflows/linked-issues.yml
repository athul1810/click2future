name: Linked issues

# GitHub closes "Closes #N" issues when the PR merges into the default branch.
# This check makes every PR say which issues it closes or only advances.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  linked-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Check Closes / Part of references
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          import sys

          body = os.environ.get("BODY") or ""
          base, default = os.environ["BASE"], os.environ["DEFAULT"]
          keyword = r"\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b:?\s+"
          closes = sorted(set(re.findall(keyword + r"#(\d+)", body, re.I)), key=int)
          lists = re.findall(r"\bpart of\s+(#\d+(?:\s*(?:,|and)\s*#\d+)*)", body, re.I)
          partial = sorted({n for found in lists for n in re.findall(r"\d+", found)}, key=int)
          exempt = re.search(r"^\s*no linked issue\b", body, re.I | re.M)
          failed = False

          if re.search(keyword + r"#\d+\s*(?:,|and)\s*#\d+", body, re.I):
              print(
                  "::error::GitHub only closes the first issue in 'Closes #5, #6'. "
                  "Write the keyword before each issue: 'Closes #5' and 'Closes #6'."
              )
              failed = True
          if not (closes or partial or exempt):
              print(
                  "::error::Name the issues in the PR description: 'Closes #N' for each "
                  "completed issue, 'Part of #N' when work remains, or 'No linked issue' "
                  "for maintenance outside the task board."
              )
              failed = True
          if closes and base != default:
              print(
                  f"::warning::This PR targets {base}. GitHub only closes issues when a PR "
                  f"merges into {default}; retarget it to {default} before merging."
              )

          print("Closes on merge:", ", ".join(f"#{n}" for n in closes) or "none")
          print("Stays open:", ", ".join(f"#{n}" for n in partial) or "none")
          sys.exit(1 if failed else 0)
          EOF
